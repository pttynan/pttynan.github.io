<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSC Master Installer Suite</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 950px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { color: #1f4e79; margin-top: 0; }
        .tabs {
            display: flex;
            border-bottom: 2px solid #b4c6e7;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: bold;
            color: #555;
        }
        .tab-btn.active {
            color: #1f4e79;
            border-bottom: 3px solid #1f4e79;
            margin-bottom: -2px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; position: relative; }
        label {
            display: inline-block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: help;
            border-bottom: 1px dashed #999;
        }
        label:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 0;
            top: -35px;
            background: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: normal;
            z-index: 10;
            white-space: nowrap;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #b4c6e7;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .zone-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .zone-table th, .zone-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .zone-table th { background-color: #f8fafc; color: #1f4e79; }
        button.generate-btn {
            width: 100%;
            background-color: #1f4e79;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 25px;
        }
        button.generate-btn:hover { background-color: #153654; }
        
        .output-container {
            margin-top: 20px;
        }
        .sequence-block {
            background: #e9ecef;
            border-left: 5px solid #1f4e79;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
        }
        .sequence-title {
            font-weight: bold;
            color: #1f4e79;
            font-size: 0.95em;
            margin-bottom: 4px;
        }
        .sequence-keys {
            font-family: monospace;
            font-size: 1.15em;
            color: #222;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>DSC PowerSeries Suite (PC1616 / PC1832 / PC1864)</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('core')">Core & Comms</button>
        <button class="tab-btn" onclick="switchTab('zones1')">Zones 1-16</button>
        <button class="tab-btn" onclick="switchTab('zones2')">Expansion Zones (17-32)</button>
    </div>

    <!-- TAB 1: CORE CORE SETTINGS -->
    <div id="core" class="tab-content active">
        <div class="grid-2">
            <div class="form-group">
                <label data-tooltip="4-digit code required to enter configuration mode. Factory default is 5555.">Installer Code</label>
                <input type="text" id="installerCode" value="5555" maxlength="4">
            </div>
            <div class="form-group">
                <label data-tooltip="Section [301]: Primary telephone receiver number for reporting central monitoring signals.">Primary Phone Number [301]</label>
                <input type="text" id="phoneNumber" value="18556859813">
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label data-tooltip="Section [310]: 6-digit main system code. If using a 4-digit code, append with HEX 'FF' (*66).">System Account Code [310]</label>
                <input type="text" id="account310" value="0012" maxlength="6">
            </div>
            <div class="form-group">
                <label data-tooltip="Section [311]: 4-digit communication identifier mapped specifically to Partition 1 operations.">Partition 1 Account [311]</label>
                <input type="text" id="account311" value="0012" maxlength="4">
            </div>
        </div>
        <div class="form-group">
            <label data-tooltip="Section [013] Option 1: ON strips out line resistor requirements, looking for pure short/open states.">Loop Configuration [013]</label>
            <select id="ncLoops">
                <option value="enable">Normally Closed (NC) Loops - No Resistors</option>
                <option value="disable">End of Line (EOL) Resistors Required</option>
            </select>
        </div>
    </div>

    <!-- TAB 2: ZONES 1-16 -->
    <div id="zones1" class="tab-content">
        <table class="zone-table">
            <thead>
                <tr>
                    <th>Zone</th>
                    <th data-tooltip="Section [001]: Dictates how the control panel handles triggers on this hardware address.">Zone Definition Assignment</th>
                    <th data-tooltip="Optional 6-digit Electronic Serial Number for wireless enrollment (Zones 9+).">Wireless ESN</th>
                </tr>
            </thead>
            <tbody id="zoneTableBody1"></tbody>
        </table>
    </div>

    <!-- TAB 3: ZONES 17-32 -->
    <div id="zones2" class="tab-content">
        <table class="zone-table">
            <thead>
                <tr>
                    <th>Zone</th>
                    <th data-tooltip="Section [002]: Dictates behaviors for higher tier zones 17-32.">Zone Definition Assignment</th>
                    <th data-tooltip="Optional 6-digit Electronic Serial Number for wireless enrollment (Zones 9+).">Wireless ESN</th>
                </tr>
            </thead>
            <tbody id="zoneTableBody2"></tbody>
        </table>
    </div>

    <button class="generate-btn" onclick="buildProgrammingMatrix()">Generate Programming Template</button>

    <h3>Broken-Down Keypress Sequence</h3>
    <div class="output-container" id="output">
        <div class="sequence-block">
            <div class="sequence-title">Ready Status</div>
            <div class="sequence-keys">Fill values and tap generate...</div>
        </div>
    </div>
</div>

<script>
    const baseDefinitions = [
        { val: "00", text: "00 - Null Zone (Deactivated)" },
        { val: "01", text: "01 - Delay 1 (Entry/Exit Paths)" },
        { val: "02", text: "02 - Delay 2 (Secondary Paths)" },
        { val: "03", text: "03 - Instant (Perimeter Doors/Windows)" },
        { val: "04", text: "04 - Interior (Motion Detectors)" },
        { val: "05", text: "05 - Interior Stay/Away (Bypassed via Stay Profile)" },
        { val: "06", text: "06 - Delay Stay/Away" },
        { val: "08", text: "08 - Standard 24-Hour Fire" },
        { val: "11", text: "11 - 24-Hour Burglary" },
        { val: "16", text: "16 - 24-Hour Panic" }
    ];

    const wirelessSmokeDef = { val: "88", text: "88 - Standard 24-Hour Fire (Wireless)" };

    function switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function populateTable(targetId, startZone, endZone) {
        const body = document.getElementById(targetId);
        for (let i = startZone; i <= endZone; i++) {
            let tr = document.createElement('tr');
            let defaultVal = "00";
            if (i === 1) defaultVal = "01";
            if (i === 2) defaultVal = "03";

            let availableDefs = [...baseDefinitions];
            if (i > 8) {
                availableDefs.push(wirelessSmokeDef);
            }

            let optionsHTML = availableDefs.map(d => 
                `<option value="${d.val}" ${d.val === defaultVal ? 'selected' : ''}>${d.text}</option>`
            ).join('');

            // Only enable ESN text input for zones above 8 (where wireless expansion is supported)
            let esnInputHTML = i > 8 
                ? `<input type="text" id="esn-z${i}" placeholder="e.g. 2A1B3C" maxlength="6" style="text-transform: uppercase;">` 
                : `<span style="color: #999; font-size: 0.85em; font-style: italic;">N/A (Hardwired zone)</span>`;

            tr.innerHTML = `
                <td><strong>Zone ${i}</strong></td>
                <td><select id="def-z${i}">${optionsHTML}</select></td>
                <td>${esnInputHTML}</td>
            `;
            body.appendChild(tr);
        }
    }

    populateTable('zoneTableBody1', 1, 16);
    populateTable('zoneTableBody2', 17, 32);

    function buildProgrammingMatrix() {
        const inst = document.getElementById('installerCode').value.split('').join(' ');
        const phone = document.getElementById('phoneNumber').value.split('').join(' ');
        const acct310 = document.getElementById('account310').value;
        const acct311 = document.getElementById('account311').value;
        const nc = document.getElementById('ncLoops').value;

        let blocks = [];

        // 1. Enter Programming
        blocks.push({
            title: "Enter Installer Programming Mode",
            keys: `* 8 ${inst}`
        });

        // Find highest active zone for Section 001 (Zones 1-16)
        let maxZ1 = 0;
        for (let i = 1; i <= 16; i++) {
            if (document.getElementById(`def-z${i}`).value !== "00") maxZ1 = i;
        }

        // Only build section 001 if at least one zone is configured
        if (maxZ1 > 0) {
            let z1_16 = "0 0 1   ";
            for (let i = 1; i <= maxZ1; i++) {
                z1_16 += `${document.getElementById(`def-z${i}`).value.split('').join(' ')}   `;
            }
            z1_16 += "#";
            blocks.push({
                title: `Zone Definitions [001] (Zones 1 to ${maxZ1})`,
                keys: z1_16
            });
        }

        // Find highest active zone for Section 002 (Zones 17-32)
        let maxZ2 = 0;
        for (let i = 17; i <= 32; i++) {
            if (document.getElementById(`def-z${i}`).value !== "00") maxZ2 = i;
        }

        if (maxZ2 > 0) {
            let z17_32 = "0 0 2   ";
            for (let i = 17; i <= maxZ2; i++) {
                z17_32 += `${document.getElementById(`def-z${i}`).value.split('').join(' ')}   `;
            }
            z17_32 += "#";
            blocks.push({
                title: `Zone Definitions [002] (Zones 17 to ${maxZ2})`,
                keys: z17_32
            });

            // Keyboard/Expander slots allocation map [020]
            blocks.push({
                title: "Keypad Zone Assignments [020]",
                keys: "0 2 0   0 0 0 #"
            });
        }

        // System Toggles [013] (Normally Closed loops)
        if (nc === 'enable') {
            blocks.push({
                title: "First System Options [013] (Enable Normally Closed Loops)",
                keys: "0 1 3   1 #"
            });
        }

        // Zone Enabling Mask Blocks [202] - [205]
        let masks = { 202: false, 203: false, 204: false, 205: false };
        for(let i=1; i<=8; i++)   if(document.getElementById(`def-z${i}`).value !== "00") masks[202] = true;
        for(let i=9; i<=16; i++)  if(document.getElementById(`def-z${i}`).value !== "00") masks[203] = true;
        for(let i=17; i<=24; i++) if(document.getElementById(`def-z${i}`).value !== "00") masks[204] = true;
        for(let i=25; i<=32; i++) if(document.getElementById(`def-z${i}`).value !== "00") masks[205] = true;

        Object.keys(masks).forEach(sec => {
            if (masks[sec]) {
                let secStr = sec.toString().split('').join(' ');
                let mKeys = `${secStr}   `;
                for(let b=1; b<=8; b++) mKeys += `${b} `;
                mKeys += "#";
                blocks.push({
                    title: `Zone Enabler Matrix [${sec}]`,
                    keys: mKeys
                });
            }
        });

        // 2. Wireless Serial Number (ESN) Enrollment Blocks [804] -> [01] to [32]
        for (let i = 9; i <= 32; i++) {
            let esnInput = document.getElementById(`esn-z${i}`);
            if (esnInput && esnInput.value.trim().length === 6) {
                let zoneStr = String(i).padStart(2, '0').split('').join(' ');
                let cleanEsn = esnInput.value.trim().toUpperCase().split('').join(' ');
                blocks.push({
                    title: `Wireless ESN Enrollment - Zone ${i} [804 -> ${zoneStr}]`,
                    keys: `8 0 4   ${zoneStr}   ${cleanEsn}   #`
                });

                // Also generate the wireless attribute configuration block [101-132] where option 8 is wireless supervision
                let attrSec = 100 + i;
                blocks.push({
                    title: `Wireless Zone Attributes - Zone ${i} [${attrSec}] (Option 8 ON for Wireless)`,
                    keys: `${String(attrSec).split('').join(' ')}   8   #`
                });
            }
        }

        // Communications / Phone & Account Codes [301], [310], [311]
        blocks.push({
            title: "Primary Phone Number [301]",
            keys: `3 0 1   ${phone}   #`
        });

        let pad310 = acct310.length === 4 ? `${acct310.split('').join(' ')}   * 6 6` : acct310.split('').join(' ');
        blocks.push({
            title: "System Account Code [310]",
            keys: `3 1 0   ${pad310}`
        });

        blocks.push({
            title: "Partition 1 Account Code [311]",
            keys: `3 1 1   ${acct311.split('').join(' ')}`
        });

        // Exit Programming
        blocks.push({
            title: "Exit Programming Mode",
            keys: "# #"
        });

        // Render broken-down layout into output container
        let container = document.getElementById('output');
        container.innerHTML = "";
        blocks.forEach(b => {
            let div = document.createElement('div');
            div.className = 'sequence-block';
            div.innerHTML = `<div class="sequence-title">${b.title}</div><div class="sequence-keys">${b.keys}</div>`;
            container.appendChild(div);
        });
    }
</script>

</body>
</html>
